name: Deploy to Heroku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    name: Verify main
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Heroku configuration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_APP_URL: ${{ vars.HEROKU_APP_URL }}
        run: |
          for name in HEROKU_API_KEY HEROKU_EMAIL HEROKU_APP_NAME HEROKU_APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the production environment before deploying."
              exit 1
            fi
          done
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Generate Heroku requirements from pyproject.toml
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          dependencies = project["project"]["dependencies"]
          Path("requirements.txt").write_text("\n".join(dependencies) + "\n")
          PY
      - name: Install Heroku CLI
        run: curl --fail --silent --show-error --location https://cli-assets.heroku.com/install-ubuntu.sh | sh
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          heroku_app_name: ${{ vars.HEROKU_APP_NAME }}
          dontautocreate: true
          branch: main
      - name: Verify deployment
        env:
          HEROKU_APP_URL: ${{ vars.HEROKU_APP_URL }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            "${HEROKU_APP_URL%/}/health"
